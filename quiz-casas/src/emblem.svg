<svg class="emblem" id="emblemSvg" viewBox="0 0 240 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chaveiro com o emblema da casa">
  <defs>
    <linearGradient id="pewter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2D0CF"/><stop offset=".38" stop-color="#8A8989"/><stop offset=".6" stop-color="#B5B3B3"/><stop offset="1" stop-color="#5F5E5E"/>
    </linearGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5F5E5E"/><stop offset="1" stop-color="#8F8E8E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fieldMask" maskUnits="userSpaceOnUse" x="20" y="36" width="200" height="220">
      <image href="/*FIELDMASK*/" x="20" y="36" width="200" height="223.75"/>
    </mask>
    <clipPath id="fieldClip"><rect x="40" y="40" width="160" height="214"/></clipPath>
  </defs>
  <g class="keep">
    <circle cx="120" cy="16" r="11" fill="none" stroke="url(#pewter)" stroke-width="5"/>
    <rect x="114" y="25" width="12" height="17" rx="3" fill="url(#pewter)"/>
  </g>
  <g id="shieldBody" class="shieldBody">
    <g clip-path="url(#fieldClip)"><g mask="url(#fieldMask)">
      <rect x="20" y="36" width="200" height="226" fill="url(#recess)"/>
      <g id="bands"></g>
      <rect class="flood" id="flood" x="20" y="36" width="200" height="226" fill="#C2362B"/>
      <rect x="20" y="36" width="200" height="226" fill="url(#gloss)"/>
    </g></g>
    <image href="/*FRAME*/" x="20" y="36" width="200" height="223.75"/>
  </g>
  <image id="crestImg" class="crest" x="20" y="36" width="200" height="223.75" preserveAspectRatio="xMidYMid meet" href="" opacity="0"/>
  <g class="keep">
    <rect x="115" y="256" width="10" height="16" rx="3" fill="url(#pewter)"/>
    <rect x="50" y="268" width="140" height="34" rx="7" fill="url(#pewter)" stroke="#4A4949" stroke-width="1"/>
    <rect x="55" y="273" width="130" height="24" rx="4" fill="none" stroke="#5F5E5E" stroke-opacity=".6" stroke-width="1"/>
  </g>
  <text id="plateShade" x="120" y="292" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-weight="800" font-size="17" letter-spacing="1.5" fill="#E6E4E3" fill-opacity=".75"></text>
  <text id="plateText" x="120" y="291" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-weight="800" font-size="17" letter-spacing="1.5" fill="#2E2D2D"></text>
</svg>
